name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: Go race and loopback STCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: go/go.sum
      - name: Download locked modules
        working-directory: go
        run: go mod download all
      - name: Race regression
        working-directory: go
        run: go test -race ./frpclib -count=1 -v
      - name: Local STCP integration
        run: ./tests/run-e2e.sh

  ios:
    name: Swift controller and unsigned iOS build
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: go/go.sum
      - name: Controller regression
        run: ./tests/run-controller-tests.sh
      - name: Unsigned iOS build
        run: ./build.sh --unsigned
      - name: Blank defaults, payload and path audit
        run: python3 tests/audit-ipa-defaults.py build/FrpClient-unsigned.ipa
